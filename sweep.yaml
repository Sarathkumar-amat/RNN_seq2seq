early_terminate:
  min_iter: 3
  type: hyperband
method: bayes
metric:
  goal: maximize
  name: val_accuracy
parameters:
  batch_size:
    values:
    - 32
    - 64
  beam_size:
    values:
    - 1
    - 3
    - 5
  cell_type:
    values:
    - rnn
    - gru
    - lstm
  dec_layers:
    values:
    - 1
    - 2
    - 3
  dropout:
    values:
    - 0.2
    - 0.3
  embed:
    values:
    - 16
    - 32
    - 64
    - 128
    - 256
  enc_layers:
    values:
    - 1
    - 2
    - 3
  hidden:
    values:
    - 32
    - 64
    - 128
    - 256
  learning_rate:
    values:
    - 0.001
    - 0.0005
    - 0.0001
program: train.py
